</style></head><body><main class="shell">
<header class="hero"><div class="badge" aria-hidden="true">🎲</div><h1>TavliFunny</h1></header>
<section class="panel" aria-label="TavliFunny — Πόρτες">
<div class="topstrip" aria-hidden="true"><span id="turn"></span><span id="off"></span><span id="score"></span></div>
<div class="gamebar">
  <div id="dice" class="dice" aria-label="Ζάρια"></div>
  <div id="moveChoices" class="move-choices" hidden aria-label="Διάλεξε κίνηση με ένα ή δύο ζάρια"></div>
  <div class="controls">
    <button class="tool" id="new" type="button" aria-label="Νέα παρτίδα" title="Νέα παρτίδα">↻</button>

  </div>
</div>
<p class="message" id="message" role="status" aria-live="polite">Τα ζάρια ρίχνονται αυτόματα.</p>
<div class="board-wrap"><div class="board" id="board"><div class="center-bar" id="centerBar" aria-label="Μπάρα με χτυπημένα πούλια"><div class="bar-hit" id="barC" role="img" aria-label="Μπλε χτυπημένα πούλια: 0"></div><button class="bar-hit" id="barH" type="button" aria-label="Λευκά χτυπημένα πούλια: 0" disabled></button></div><div id="bearingTray" class="bearing-tray" aria-label="Θέση μαζέματος πουλιών"><div id="bearingAI" class="bearing-ai" aria-label="Μπλε μαζεμένα πούλια: 0"></div><div id="bearingHuman" class="bearing-human" aria-label="Μάζεμα λευκών πουλιών"></div></div></div></div>
</section></main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),SAVE='tavlifunny:portes:v1',SCORE='tavlifunny:score:v1';
const initial=()=>{const b=Array(24).fill(0);b[23]=2;b[12]=5;b[7]=3;b[5]=5;b[0]=-2;b[11]=-5;b[16]=-3;b[18]=-5;return {b,barH:0,barC:0,offH:0,offC:0,turn:'h',dice:[],winner:null,moves:0};};
let g=initial(),source=null,available=[],chooser=null,active=true,aiTimer=0,rollTimer=0,scores={h:0,c:0};
try{scores=JSON.parse(localStorage.getItem(SCORE)||'null')||scores;}catch(_){}
const count=(b,side,i)=>Math.max(0,b[i]*(side==='h'?1:-1)),isOwn=(b,side,i)=>count(b,side,i)>0;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(g))}catch(_){}}
function say(v){$('message').textContent=v}
function die(){return 1+Math.floor(Math.random()*6)}
function possible(g,side,d){const b=g.b,res=[],bar=side==='h'?g.barH:g.barC;
if(bar){const dest=side==='h'?24-d:d-1;if(count(b,side==='h'?'c':'h',dest)>=2)return [];return [{from:'bar',to:dest,die:d}];}
for(let from=0;from<24;from++){if(!isOwn(b,side,from))continue;const to=from+(side==='h'?-d:d);
if(to>=0&&to<24){if(count(b,side==='h'?'c':'h',to)<2)res.push({from,to,die:d});continue;}
const home=side==='h'?[0,5]:[18,23],barCount=side==='h'?g.barH:g.barC;if(barCount)continue;
let all=true;for(let p=0;p<24;p++)if(isOwn(b,side,p)&&(p<home[0]||p>home[1]))all=false;
if(!all)continue;
const distance=side==='h'?from+1:24-from;
if(d===distance||(d>distance&& (side==='h'?!b.slice(from+1,6).some(x=>x>0):!b.slice(18,from).some(x=>x<0))))res.push({from,to:'off',die:d});
}return res;}
function apply(g,m,side){const out={...g,b:g.b.slice(),dice:g.dice.slice()},sign=side==='h'?1:-1;
if(m.from==='bar'){if(side==='h')out.barH--;else out.barC--;}else out.b[m.from]-=sign;
if(m.to==='off'){if(side==='h')out.offH++;else out.offC++;}
else{if(out.b[m.to]===-sign){out.b[m.to]=0;if(side==='h')out.barC++;else out.barH++;}out.b[m.to]+=sign;}
out.dice.splice(out.dice.indexOf(m.die),1);out.moves++;return out;}
function enumerate(g,side,dice,sequence=[],max=4){if(!dice.length||!max)return [sequence];let sets=[];
for(const d of [...new Set(dice)]){const moves=possible(g,side,d);for(const m of moves){const rest=dice.slice();rest.splice(rest.indexOf(d),1);const after=apply({...g,dice:dice.slice()},m,side);sets.push(...enumerate(after,side,rest,[...sequence,m],max-1));}}
return sets.length?sets:[sequence];}
function lines(g,side){const seqs=enumerate(g,side,g.dice);const best=Math.max(...seqs.map(s=>s.length));let good=seqs.filter(s=>s.length===best);
if(best===1&&g.dice.length===2&&g.dice[0]!==g.dice[1]){const higher=Math.max(...good.map(s=>s[0].die));good=good.filter(s=>s[0].die===higher);}
return good;}
function legal(){const result=new Map();for(const line of lines(g,g.turn)){if(!line.length)continue;const m=line[0];result.set(m.from+':'+m.to+':'+m.die,m);}return [...result.values()];}
// A two-die shortcut is legal only if BOTH consecutive steps are legal
// in the same maximal-length dice sequence. It never jumps over a block.
function choicesFor(from){
 if(g.turn!=='h'||g.winner||!g.dice.length)return [];
 const out=available.filter(m=>m.from===from).map(m=>({to:m.to,steps:[m]}));
 if(g.dice.length>=2){
  const seen=new Set();
  for(const route of lines(g,'h')){
   if(route.length<2)continue;
   const a=route[0],b=route[1];
   if(a.from!==from||a.to==='off'||b.from!==a.to)continue;
   const key=String(b.to)+':'+a.die+':'+b.die;
   if(seen.has(key))continue;seen.add(key);
   out.push({to:b.to,steps:[a,b]});
  }
 }
 return out;
}
function routeScore(c){
 let state=g,points=0;
 for(const move of c.steps){
  if(move.to!=='off'&&state.b[move.to]===-1)points+=10;
  state=apply(state,move,'h');
 }
 return points;
}
function chooseFrom(from){
 if(g.turn!=='h'||!g.dice.length||g.winner||!available.some(m=>m.from===from))return;
 source=from;chooser=null;draw();
}
function humanTo(to,diceCount=null){
 if(g.turn!=='h'||!g.dice.length||g.winner||source===null)return;
 let options=choicesFor(source).filter(c=>c.to===to);
 if(diceCount!==null)options=options.filter(c=>c.steps.length===diceCount);
 if(!options.length){
  if(to!=='off'&&available.some(m=>m.from===to)){source=to;chooser=null;draw();return;}
  say('Δεν επιτρέπεται η συγκεκριμένη κίνηση.');return;
 }
 const lengths=[...new Set(options.map(c=>c.steps.length))];
 if(diceCount===null&&lengths.length>1){chooser={to};draw();return;}
 options.sort((a,b)=>routeScore(b)-routeScore(a)||a.steps[0].die-b.steps[0].die);
 // Apply both steps as ONE interaction, but preserve all intermediate hits.
 let state=g;
 for(const move of options[0].steps)state=apply(state,move,'h');
 g=state;source=null;chooser=null;next();draw();save();
}
function next(){chooser=null;if(g.offH===15||g.offC===15){g.winner=g.offH===15?'h':'c';scores[g.winner]=(scores[g.winner]||0)+1;try{localStorage.setItem(SCORE,JSON.stringify(scores));}catch(_){}say(g.winner==='h'?'🏆 Κέρδισες τις Πόρτες!':'Ο υπολογιστής κέρδισε. Παίζουμε ξανά;');g.dice=[];return;}
available=legal();
if(!g.dice.length||!available.length){g.turn=g.turn==='h'?'c':'h';g.dice=[];available=[];source=null;if(g.turn==='h'){say('Τα ζάρια ρίχνονται αυτόματα…');scheduleRoll();}else{say('Ο υπολογιστής ρίχνει ζάρια…');scheduleAI();}}
else if(g.turn==='h')say('Διάλεξε πούλι και φωτισμένη θέση.');}
function aiScore(seq){const temp={...g,b:g.b.slice(),dice:g.dice.slice()};let x=temp,bonus=0;for(const m of seq){const hit=m.to!=='off'&&x.b[m.to]===1; x=apply(x,m,'c');if(hit)bonus+=18;if(m.to==='off')bonus+=30;if(m.to!=='off'&&Math.abs(x.b[m.to])>=2)bonus+=3;}let home=0;for(let i=0;i<24;i++)if(x.b[i]<0)home+=-x.b[i]*(i/24);return bonus+home+Math.random()*4;}
function runAI(){aiTimer=0;if(!active||g.turn!=='c'||g.winner)return;
if(!g.dice.length){const a=die(),b=die();g.dice=a===b?[a,a,a,a]:[a,b];say('Ο υπολογιστής έφερε '+a+' και '+b+'.');draw();save();}
const choices=lines(g,'c').filter(x=>x.length);
if(!choices.length){g.dice=[];next();draw();save();return;}
choices.sort((a,b)=>aiScore(b)-aiScore(a));g=apply(g,choices[0][0],'c');next();draw();save();if(g.turn==='c'&&g.dice.length)scheduleAI();}
function scheduleAI(){if(aiTimer)clearTimeout(aiTimer);if(active&&g.turn==='c'&&!g.winner)aiTimer=setTimeout(runAI,420);}
function scheduleRoll(){
 if(rollTimer)clearTimeout(rollTimer);rollTimer=0;
 if(active&&g.turn==='h'&&!g.winner&&!g.dice.length)rollTimer=setTimeout(()=>{rollTimer=0;roll();},430);
}
function roll(){if(!active||g.turn!=='h'||g.dice.length||g.winner)return;let a=die(),b=die();g.dice=a===b?[a,a,a,a]:[a,b];available=legal();say(a===b?'Διπλές! Μετακίνησε τα πούλια σου.':'Μετακίνησε τα πούλια σου.');if(!available.length){g.dice=[];say('Δεν υπάρχει διαθέσιμη κίνηση. Παίζει ο υπολογιστής.');next();}draw();save();}
function draw(){
$('turn').textContent=g.winner?(g.winner==='h'?'Νίκη!':'Ήττα'):g.turn==='h'?'Η σειρά σου':'Παίζει ο υπολογιστής';
$('score').textContent='Νίκες '+(scores.h||0)+'–'+(scores.c||0);
$('off').textContent='Έξοδος: Εσύ '+g.offH+'/15 · AI '+g.offC+'/15';

$('dice').replaceChildren();
const faces={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const diceValues=g.dice.length===4?[g.dice[0],g.dice[0]]:g.dice.slice(0,2);
for(const n of diceValues){
 const dieEl=document.createElement('span');dieEl.className='die';dieEl.setAttribute('role','img');dieEl.setAttribute('aria-label','Ζάρι '+n);
 for(let dot=0;dot<9;dot++){const pip=document.createElement('span');pip.className='pip-dot'+(faces[n].includes(dot)?' on':'');dieEl.appendChild(pip);}
 $('dice').appendChild(dieEl);
}
if(g.dice.length>=3){const extra=document.createElement('span');extra.className='dice-stack';extra.textContent='×'+g.dice.length;$('dice').appendChild(extra);}
if(!g.dice.length){const wait=document.createElement('span');wait.className='dice-wait';wait.textContent=g.winner?'Τέλος παρτίδας':'🎲';$('dice').appendChild(wait);}
function fillBar(id,number,side){
 const el=$(id);el.replaceChildren();el.setAttribute('aria-label',(side==='h'?'Λευκά':'Μπλε')+' χτυπημένα πούλια: '+number);el.title=number?number+' χτυπημένα πούλια':'';
 for(let i=0;i<Math.min(4,number);i++){const disc=document.createElement('span');disc.className='disc bar-disc '+side;el.appendChild(disc);}
 if(number>4){const count=document.createElement('span');count.className='bar-count';count.textContent=String(number);el.appendChild(count);}
}
fillBar('barH',g.barH,'h');fillBar('barC',g.barC,'c');
$('barH').classList.toggle('selectable',source==='bar');
$('barH').classList.toggle('legal-bar',available.some(m=>m.from==='bar'));
$('barH').disabled=!active||g.turn!=='h'||!g.barH||!available.some(m=>m.from==='bar');
const root=$('board');root.replaceChildren($('centerBar'),$('bearingTray'));
const order=[...Array.from({length:12},(_,i)=>12+i),...Array.from({length:12},(_,i)=>11-i)];
const allChoices=source===null?[]:choicesFor(source);
const singleDest=new Set(allChoices.filter(c=>c.steps.length===1).map(c=>c.to));
const doubleDest=new Set(allChoices.filter(c=>c.steps.length===2).map(c=>c.to));
for(let i=0;i<order.length;i++){const p=order[i],v=g.b[p],point=document.createElement('button');point.type='button';
const one=singleDest.has(p),two=doubleDest.has(p);
point.className='point '+(i<12?'top':'bottom')+(source===p?' selected':'')+(one&&two?' legal-both':two?' legal-double':one?' legal':'');
point.style.gridColumn=String(i%12+1+(i%12>=6?1:0));point.style.gridRow=i<12?'1':'2';
point.setAttribute('aria-label','Θέση '+(p+1)+': '+Math.abs(v)+' '+(v>0?'λευκά':'μπλε'));
const box=document.createElement('span');box.className='discs';for(let j=0;j<Math.min(5,Math.abs(v));j++){let disc=document.createElement('span');disc.className='disc '+(v>0?'h':'c');if(j===4&&Math.abs(v)>5)disc.textContent='+'+(Math.abs(v)-4);box.appendChild(disc);}point.appendChild(box);
if(one||two){
 const badge=document.createElement('span');badge.className='step-tag';
 badge.textContent=one&&two?'1·2':two?'2':'1';point.appendChild(badge);
 point.setAttribute('aria-label',point.getAttribute('aria-label')+' · '+(one&&two?'Ένα ή δύο ζάρια':two?'Δύο ζάρια':'Ένα ζάρι'));
}
point.addEventListener('click',()=>{
 if(source!==null&&(one||two))humanTo(p);
 else if(available.some(m=>m.from===p))chooseFrom(p);
});root.appendChild(point);}
// Draw the bearing-off controls INSIDE the board, next to the home points.
const aiTray=$('bearingAI'),humanTray=$('bearingHuman');
aiTray.replaceChildren();humanTray.replaceChildren();
aiTray.setAttribute('aria-label','Μπλε μαζεμένα πούλια: '+g.offC);
humanTray.setAttribute('aria-label','Λευκά μαζεμένα πούλια: '+g.offH);
for(let i=0;i<Math.min(g.offC,3);i++){
 const chip=document.createElement('span');chip.className='disc bearing-disc c';aiTray.appendChild(chip);
}
if(g.offC>3){const count=document.createElement('span');count.className='bearing-count';count.textContent=String(g.offC);aiTray.appendChild(count);}
const offLengths=[...new Set(allChoices.filter(c=>c.to==='off').map(c=>c.steps.length))].sort();
humanTray.classList.toggle('has-move',offLengths.length>0);
for(const n of offLengths){
 const btn=document.createElement('button');btn.type='button';
 btn.className='off-collect'+(n===2?' double':'');
 btn.setAttribute('aria-label','Μάζεμα πούλι με '+n+(n===1?' ζάρι':' ζάρια'));
 btn.title='Μάζεμα με '+n+(n===1?' ζάρι':' ζάρια');
 const icon=document.createElement('span');icon.className='icon';icon.textContent='✓';
 const number=document.createElement('span');number.className='dice-number';number.textContent=n===1?'1 ζάρι':'2 ζάρια';
 btn.appendChild(icon);btn.appendChild(number);
 btn.addEventListener('click',()=>humanTo('off',n));humanTray.appendChild(btn);
}
for(let i=0;i<Math.min(g.offH,offLengths.length?2:3);i++){
 const chip=document.createElement('span');chip.className='disc bearing-disc h';humanTray.appendChild(chip);
}
if(g.offH>3){const count=document.createElement('span');count.className='bearing-count';count.textContent=String(g.offH);humanTray.appendChild(count);}
// Keep the top control only for ambiguous on-board moves, never for bearing off.
const panel=$('moveChoices');panel.replaceChildren();
const choices=chooser?[...new Set(allChoices.filter(c=>c.to===chooser.to).map(c=>c.steps.length))].sort():[];
for(const n of choices){
 const btn=document.createElement('button');btn.type='button';
 btn.className='move-btn'+(n===2?' double':'');
 btn.textContent=n+(n===1?' ζάρι':' ζάρια');
 btn.setAttribute('aria-label','Μετακίνηση με '+n+(n===1?' ζάρι':' ζάρια'));
 btn.addEventListener('click',()=>humanTo(chooser.to,n));panel.appendChild(btn);
}
panel.hidden=!choices.length;
}
$('barH').addEventListener('click',()=>{if(g.barH&&available.some(m=>m.from==='bar'))chooseFrom('bar')});
$('new').addEventListener('click',()=>{if(!g.winner&&g.moves&&!confirm('Νέα παρτίδα; Θα χαθεί η τωρινή.'))return;g=initial();available=[];source=null;chooser=null;clearTimeout(aiTimer);clearTimeout(rollTimer);aiTimer=0;rollTimer=0;say('Νέα παρτίδα — αυτόματη ρίψη…');draw();save();scheduleRoll();});
function visibility(){active=document.visibilityState==='visible'&&embeddedActive;if(!active){clearTimeout(aiTimer);clearTimeout(rollTimer);aiTimer=0;rollTimer=0;}else if(!g.winner){if(g.turn==='c')scheduleAI();else if(!g.dice.length)scheduleRoll();}}
let embeddedActive=true;window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='tavlifunny:visibility'){embeddedActive=!!e.data.active;visibility();}});
document.addEventListener('visibilitychange',visibility);
try{const saved=JSON.parse(localStorage.getItem(SAVE)||'null');if(saved&&Array.isArray(saved.b)&&saved.b.length===24&&['h','c'].includes(saved.turn)){g=saved;available=g.dice.length?legal():[];say('Η αποθηκευμένη παρτίδα συνεχίζεται.');}else say('Τα ζάρια ρίχνονται αυτόματα.');}catch(_){}
draw();if(active&&!g.winner){if(g.turn==='c')scheduleAI();else if(!g.dice.length)scheduleRoll();}
})();
</script></body></html>
